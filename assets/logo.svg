<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1324"/>
      <stop offset="55%" stop-color="#11223E"/>
      <stop offset="100%" stop-color="#0B1930"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="56%" cy="54%" r="54%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0A1324" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hostScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3358"/>
      <stop offset="100%" stop-color="#102038"/>
    </linearGradient>
    <linearGradient id="hostStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="ipadStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="ipadScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164E87"/>
      <stop offset="55%" stop-color="#1D63B8"/>
      <stop offset="100%" stop-color="#0F2D54"/>
    </linearGradient>
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircleClip)">
    <!-- Background -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#ambientGlow)"/>

    <!-- Primary Linux Host Monitor (back-left) -->
    <rect x="384" y="516" width="44" height="58" fill="#4E8DF5" opacity="0.80"/>
    <rect x="318" y="566" width="176" height="22" rx="11" fill="#60A5FA" opacity="0.88"/>

    <rect x="166" y="220" width="480" height="300" rx="28" fill="#0D1A30" stroke="url(#hostStrokeGrad)" stroke-width="14"/>
    <rect x="184" y="238" width="444" height="264" rx="16" fill="url(#hostScreenGrad)"/>

    <!-- Clean separation cutout around overlapping iPad -->
    <rect x="422" y="420" width="452" height="344" rx="44" fill="#0B1528"/>

    <!-- Secondary iPad Monitor (front-right) -->
    <rect x="438" y="436" width="420" height="312" rx="34" fill="#0A1426" stroke="url(#ipadStrokeGrad)" stroke-width="15"/>
    <rect x="458" y="456" width="380" height="272" rx="20" fill="url(#ipadScreenGrad)"/>

    <!-- Extend display glyph -->
    <g fill="none" stroke="#F8FAFC" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
      <line x1="586" y1="592" x2="706" y2="592"/>
      <polyline points="662,548 708,592 662,636"/>
    </g>
  </g>
</svg>
